<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title data-i18n="title.post">Post · CHATTER</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="post">
<div class="app">
    <aside class="nav">
        <a class="brand" href="index.html">CHATTER</a>
        <a href="index.html">
            <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
            <span data-i18n="nav.home">Home</span>
        </a>
        <a href="people.html">
            <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.6 10.8l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
            <span data-i18n="nav.people">People</span>
        </a>
        <a href="me.html">
            <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z"/></svg>
            <span data-i18n="nav.profile">Profile</span>
        </a>
    </aside>
    <main class="feed">
        <div id="post"></div>
        <form class="reply" id="reply">
            <span class="avatar" id="reply-avatar">?</span>
            <div class="reply-main">
                <div class="reply-field">
                    <input name="content" maxlength="280" data-i18n-placeholder="reply.placeholder" placeholder="Post your reply" required>
                    <button type="button" class="photo-btn" id="reply-photo" data-i18n-aria="aria.photo" aria-label="Add photo">
                        <svg viewBox="0 0 24 24"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-13zm2.5-.5a.5.5 0 0 0-.5.5v9.1l3-3 3 3 5-5 3 3V5.5a.5.5 0 0 0-.5-.5h-13zM19 15.4l-3-3-5 5-3-3-3 3V18.5a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5V15.4zM9.5 8.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>
                    </button>
                </div>
                <div class="composer-preview" id="reply-preview" hidden>
                    <img alt="">
                    <button type="button" id="reply-clear" data-i18n-aria="aria.remove-photo" aria-label="Remove photo">×</button>
                </div>
            </div>
            <input id="reply-file" type="file" accept="image/jpeg,image/png,image/heif" hidden>
            <button class="btn" type="submit" data-i18n="action.reply">Reply</button>
        </form>
        <div id="replies"></div>
    </main>
    <aside class="side" id="following"></aside>
</div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
