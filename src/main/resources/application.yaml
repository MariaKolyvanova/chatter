spring:
  application:
    name: chatter
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/chatter_db}"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.yaml"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    root: INFO
    org:
#      hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: admin
    access-seconds: 900
  media:
    directory: media
    max-bytes: 5242880