<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title data-i18n="title.register">Register · CHATTER</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth" data-page="register">
<div class="auth-wrap">
    <a class="brand" href="index.html">CHATTER</a>
    <main class="card">
    <h1 data-i18n="register.title">Create your account</h1>
    <form class="form">
        <label><span class="field-name"><span data-i18n="field.username">Username</span> <span class="req">*</span></span><span class="with-info"><input name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9_]{3,50}" required><span class="info" tabindex="0">i<span class="info-tip" data-i18n="tip.username">3–50 characters. Latin letters, digits and underscore. Saved in lowercase.</span></span></span></label>
        <label><span class="field-name"><span data-i18n="field.email">Email</span> <span class="req">*</span></span><span class="with-info"><input name="email" type="email" maxlength="255" required><span class="info" tabindex="0">i<span class="info-tip" data-i18n="tip.email">A valid email, up to 255 characters.</span></span></span></label>
        <label><span class="field-name"><span data-i18n="field.password">Password</span> <span class="req">*</span></span><span class="with-info"><input name="password" type="password" minlength="8" maxlength="100" required><span class="info" tabindex="0">i<span class="info-tip" data-i18n="tip.password">8–100 characters.</span></span></span></label>
        <label><span class="field-name"><span data-i18n="field.display-name">Display name</span> <span class="req">*</span></span><span class="with-info"><input name="displayName" minlength="3" maxlength="100" required><span class="info" tabindex="0">i<span class="info-tip" data-i18n="tip.display-name">3–100 characters.</span></span></span></label>
        <label><span class="field-name"><span data-i18n="field.bio">Bio</span></span><span class="with-info"><textarea name="bio" rows="3"></textarea><span class="info" tabindex="0">i<span class="info-tip" data-i18n="tip.bio">Optional.</span></span></span></label>
        <label><span class="field-name"><span data-i18n="field.location">Location</span></span><span class="with-info"><input name="location" maxlength="100"><span class="info" tabindex="0">i<span class="info-tip" data-i18n="tip.location">Optional. Up to 100 characters.</span></span></span></label>
        <label><span class="field-name"><span data-i18n="field.birth-date">Birth date</span> <span class="req">*</span></span><span class="with-info"><input name="birthDate" type="text" inputmode="numeric" autocomplete="bday" spellcheck="false" maxlength="10" pattern="\d{2}/\d{2}/\d{4}" placeholder="MM/DD/YYYY" required><span class="info" tabindex="0">i<span class="info-tip" data-i18n="tip.birth-date">MM/DD/YYYY. A date in the past.</span></span></span></label>
        <button class="btn" type="submit" data-i18n="register.submit">Register</button>
    </form>
    <p class="muted"><span data-i18n="register.have-account">Already registered?</span> <a href="login.html" data-i18n="register.login">Log in</a></p>
    </main>
</div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
