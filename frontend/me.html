<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Profile · Chatter</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="me">
<div class="app">
    <aside class="nav">
        <a class="brand" href="index.html">Chatter</a>
        <a href="index.html">
            <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
            <span>Home</span>
        </a>
        <a href="people.html">
            <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 1 0 3.6 10.8l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
            <span>People</span>
        </a>
        <a class="active" href="me.html">
            <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z"/></svg>
            <span>Profile</span>
        </a>
    </aside>
    <main class="feed">
        <header class="profile-head" id="profile"></header>
        <form id="edit-form" class="form" hidden>
            <label><span class="field-name">Username</span><span class="with-info"><input name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9_]{3,50}" required><span class="info" tabindex="0">i<span class="info-tip">3–50 characters. Latin letters, digits and underscore. Saved in lowercase.</span></span></span></label>
            <label><span class="field-name">Email</span><span class="with-info"><input name="email" type="email" maxlength="255" required><span class="info" tabindex="0">i<span class="info-tip">A valid email, up to 255 characters.</span></span></span></label>
            <label><span class="field-name">Display name</span><span class="with-info"><input name="displayName" minlength="3" maxlength="100" required><span class="info" tabindex="0">i<span class="info-tip">3–100 characters.</span></span></span></label>
            <label><span class="field-name">Bio</span><span class="with-info"><textarea name="bio" rows="3"></textarea><span class="info" tabindex="0">i<span class="info-tip">Optional.</span></span></span></label>
            <label><span class="field-name">Location</span><span class="with-info"><input name="location" maxlength="100"><span class="info" tabindex="0">i<span class="info-tip">Optional. Up to 100 characters.</span></span></span></label>
            <label><span class="field-name">Birth date</span><span class="with-info"><input name="birthDate" type="date" required><span class="info" tabindex="0">i<span class="info-tip">A date in the past.</span></span></span></label>
            <button class="btn" type="submit">Save</button>
        </form>
        <form id="password-form" class="form" hidden>
            <label>Current password <input name="currentPassword" type="password" required></label>
            <label>New password <input name="newPassword" type="password" minlength="8" maxlength="100" required></label>
            <button class="btn" type="submit">Change password</button>
        </form>
        <form id="avatar-form" class="form" hidden>
            <label>
                <span class="field-name">Avatar</span>
                <span class="file-field">
                    <input name="file" type="file" accept="image/jpeg,image/png,image/heif" required>
                    <span class="info" tabindex="0">i<span class="info-tip">JPEG, PNG or HEIF. Maximum 5 MB.</span></span>
                </span>
            </label>
            <button class="btn" type="submit">Save avatar</button>
        </form>
        <div class="tabs" id="profile-tabs">
            <button class="active" type="button" data-profile-tab="posts">Posts</button>
            <button type="button" data-profile-tab="replies">Replies</button>
            <button type="button" data-profile-tab="likes">Likes</button>
            <button type="button" data-profile-tab="reposts">Reposts</button>
        </div>
        <div id="posts"></div>
        <p class="empty" id="empty" hidden>Nothing here yet.</p>
    </main>
    <aside class="side"></aside>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
