spring:
  application:
    name: chatter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatter_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.yaml"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: en
    locale-resolver: accept-header

logging:
  level:
    root: INFO
    org:
#      hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: admin
    access-seconds: 900
  media:
    directory: media
    max-bytes: 5242880